<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f47"/>
      <stop offset="100%" stop-color="#20242b"/>
    </linearGradient>
  </defs>

  <!-- Laptop screen -->
  <rect x="150" y="30" width="400" height="250" rx="14" fill="#2b2f36"/>
  <rect x="164" y="44" width="372" height="222" rx="4" fill="url(#screenGrad)"/>

  <!-- Laptop base / keyboard deck -->
  <path d="M110 280 L590 280 L620 320 Q625 330 610 330 L90 330 Q75 330 80 320 Z" fill="url(#baseGrad)"/>
  <rect x="300" y="322" width="100" height="6" rx="3" fill="#12151a"/>

  <!-- Terminal prompt lines -->
  <text x="188" y="80" fill="#3fb950" font-size="13">$ npm run build</text>
  <text x="188" y="100" fill="#8b949e" font-size="13">Compiling modules...</text>
  <text x="188" y="120" fill="#8b949e" font-size="13">Resolving dependencies...</text>

  <!-- Progress bar track -->
  <rect x="188" y="140" width="312" height="10" rx="5" fill="#21262d"/>
  <!-- Progress bar fill, loops back and forth to suggest it's stuck loading -->
  <rect x="188" y="140" width="60" height="10" rx="5" fill="#58a6ff">
    <animate attributeName="width" values="20;300;20" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Spinner -->
  <g transform="translate(350,205)">
    <circle r="22" fill="none" stroke="#21262d" stroke-width="6"/>
    <circle r="22" fill="none" stroke="#58a6ff" stroke-width="6"
            stroke-dasharray="34 104" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
                         from="0 0 0" to="360 0 0" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Loading label with blinking dots -->
  <text x="350" y="250" fill="#c9d1d9" font-size="14" text-anchor="middle">
    loading
    <tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.01;0.34;1" dur="1.5s" repeatCount="indefinite"/>
      .
    </tspan>
    <tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.5;1" dur="1.5s" repeatCount="indefinite"/>
      .
    </tspan>
    <tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.67;1" dur="1.5s" repeatCount="indefinite"/>
      .
    </tspan>
  </text>

  <!-- subtle screen glow flicker -->
  <rect x="164" y="44" width="372" height="222" rx="4" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;0.04;0" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
